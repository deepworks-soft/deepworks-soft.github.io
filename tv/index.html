<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Официальный APK скачивается из публичного стабильного выпуска GitHub. -->
<meta name="referrer" content="no-referrer">
<title>Yo-ho для телевизора</title>
<link rel="icon" href="../favicon.png">
<style>
/* Страница для телевизора: тёмный постер «Триггера» под сильным затемнением, белая кнопка. */
body{margin:0;min-height:100vh;display:grid;place-items:center;isolation:isolate;color:#F5F5F7;font:400 26px/1.5 Inter,system-ui,sans-serif;text-align:center;padding:24px;
  background:#101821;
  overflow-wrap:normal;word-break:keep-all;hyphens:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 70% 15%,#263449,#0d1118 68%)}
img{width:min(460px,80vw)}
a.go{display:inline-block;margin-top:34px;padding:22px 52px;border-radius:999px;background:#e8d4aa;color:#1c1b18;font-weight:700;text-decoration:none;font-size:30px;white-space:nowrap;transition:transform .15s}
a.go:focus{outline:4px solid #fff;outline-offset:6px;transform:scale(1.06)}
p{color:rgba(245,245,247,.65);max-width:32ch;margin:22px auto 0}
</style>
</head>
<body>
<main>
  <img src="../logo.png" alt="Yo-ho">
  <p id="t">Ищу свежую версию для телевизора…</p>
  <a class="go" id="go" href="#" autofocus>Скачать Yo-ho</a>
  <p>После загрузки нажмите «Установить». Если телевизор спросит — разрешите установку из этой программы.</p>
</main>
<script src="../disk.js?v=9"></script>
<script>
// Свежий стабильный APK напрямую с открытого GitHub.
var go=document.getElementById('go'),t=document.getElementById('t');
go.href="#";
function start(){YoHo.download('apk',function(x){if(x)t.textContent=x;});}
go.addEventListener('click',function(e){e.preventDefault();start();});
YoHo.current().then(function(j){
  if(!j.version)return;
  t.textContent='Версия '+j.version+' — загрузка начнётся сама';
  setTimeout(start,1500);
}).catch(function(){t.textContent='Нажмите кнопку, чтобы начать загрузку';});
go.focus();
</script>
</body>
</html>
