<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1717"><meta name="referrer" content="no-referrer"><meta name="description" content="Yo-ho — каталог, личная коллекция и просмотр на Android TV и Google TV. Доступ по приглашению."><title>Yo-ho для телевизора</title><link rel="icon" href="../favicon.png"><link rel="stylesheet" href="../style.css"></head><body><a class="skip" href="#main">К содержанию</a><div class="tv"><main id="main"><img class="logo" src="../assets/logo.png" alt="Yo-ho"><h1>Твой компас<br>в мире кино</h1><p data-version>Официальный стабильный выпуск</p><a class="button" href="https://github.com/deepworks-soft/yo-ho/releases/latest" data-download autofocus>Скачать Yo-ho ↓</a><p data-status>После загрузки откройте APK и нажмите «Установить». При запросе разрешите установку для Downloader.</p><a href="../install.html">Подробная инструкция</a></main></div><script src="../disk.js"></script><script>(function(){var go=document.querySelector('[data-download]'),label=document.querySelector('[data-version]'),status=document.querySelector('[data-status]');if(!window.fetch){label.textContent='Официальный релиз на GitHub';return;}go.addEventListener('click',function(e){e.preventDefault();YoHo.download('apk',function(t){status.textContent=t})});YoHo.current().then(function(c){label.textContent='Версия '+c.version+' — загрузка начнётся автоматически';setTimeout(function(){YoHo.download('apk',function(t){status.textContent=t})},1500)}).catch(function(){label.textContent='Нажмите кнопку для повторной попытки'});go.focus()})();</script></body></html>
