name: Website preview check
on:
  push:
    branches: ['preview/yoho-0.8.72']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/yoho-site.log 2>&1 &
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import {mkdir} from 'node:fs/promises';
          await mkdir('preview',{recursive:true});
          const browser=await chromium.launch({headless:true});
          for(const viewport of [{width:1440,height:1000},{width:390,height:844}]){
            const page=await browser.newPage({viewport});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.route('https://api.github.com/repos/deepworks-soft/yo-ho/releases/latest',route=>route.fulfill({json:{tag_name:'v0.8.69',draft:false,prerelease:false,assets:[{name:'Yo-ho-0.8.69.apk',state:'uploaded',browser_download_url:'https://example.invalid/Yo-ho-0.8.69.apk'}]}}));
            await page.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle'});
            assert.match(await page.locator('h1').innerText(),/компас/);
            assert.match(await page.locator('#ver').innerText(),/0\.8\.69/);
            assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),'horizontal overflow');
            assert.equal(await page.locator('img').evaluateAll(imgs=>imgs.filter(i=>!i.complete||i.naturalWidth===0).length),0);
            assert.equal(await page.locator('.feature').count(),6);
            await page.screenshot({path:'preview/home-'+viewport.width+'.png',fullPage:true});
            for(const file of ['guide.html','terms.html','privacy.html']){
              const r=await page.goto('http://127.0.0.1:8765/'+file,{waitUntil:'networkidle'});
              assert.equal(r.status(),200);
              assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),'document overflow');
              assert(!/раздач|трекер|торрент/i.test(await page.locator('main').innerText()),'obsolete wording');
            }
            assert.equal(errors.length,0,errors.join('\n'));
            await page.close();
          }
          await browser.close();
          console.log('Site layouts, assets, document links and stable release display OK');
          JS
      - name: Collect offline site preview
        run: |
          mkdir -p preview/site/tv
          cp index.html style.css disk.js guide.html guide.md privacy.html terms.html favicon.png logo.png qr-tv.png og.png icon.png preview/site/
          cp tv/index.html preview/site/tv/
      - uses: actions/upload-artifact@v4
        with:
          name: yoho-site-preview
          path: preview/
